<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="100%" height="100%">
  <defs>
    <linearGradient id="ogBgCanvas" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09090b"/>
      <stop offset="50%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    <linearGradient id="ogKeycap" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#27272a"/>
      <stop offset="100%" stop-color="#18181b"/>
    </linearGradient>
    <linearGradient id="ogEmerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="ogShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="24" flood-color="#10b981" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="1200" height="630" fill="url(#ogBgCanvas)"/>
  
  <!-- Subtle Grid Accent -->
  <g opacity="0.04" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="120" x2="1200" y2="120"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="0" y1="360" x2="1200" y2="360"/>
    <line x1="0" y1="480" x2="1200" y2="480"/>
  </g>

  <!-- Logo Group -->
  <g transform="translate(180, 160)" filter="url(#ogShadow)">
    <!-- Keycap Icon Box -->
    <rect x="0" y="0" width="160" height="160" rx="36" fill="url(#ogKeycap)" stroke="#3f3f46" stroke-width="4"/>
    
    <!-- Vector Bangla "ত" + Cursor "|" -->
    <g transform="translate(12, 12) scale(0.174)">
      <path fill="#ffffff" d="M531.13,414.42c.85,86.97-74.35,161.83-161.53,159.65-112.99-1.59-192.82-122.93-185.34-228.83.19-14.35,6.58-28.41,21.58-31.66,13.07-3.39,28.4-5.86,37.52-1.24,5.55,3.76,5.15,9.24,4.89,17.5-10.06,75.29,47.34,184.21,133.83,174.77,26.2-3.11,47.83-15.64,64.06-37.97,18.66-26.38,33.84-56.7,22.4-88.56-9.16-24.05-40.51-39.96-63.56-27.12-3.19,2.65-4.05,6.75-4.16,10.82-.03,13.2,6.57,32.23-4.21,44.36-10.32,12.37-29.46,17.23-46.66,13.25-41.99-9.84-49.53-70.92-25.85-101.38,28.53-39.42,79.58-57.66,125.48-39.15,51.95,20.75,81.5,80.2,81.55,134.61v.95Z"/>
      <path fill="#ffffff" d="M137.79,204.39h422.02c1.8,0,3.26,1.46,3.26,3.26v50.98H142.8c-2.77,0-5.01-2.25-5.01-5.01v-49.23h0Z"/>
      <rect x="601.28" y="208.08" width="39.45" height="341.45" rx="8" fill="#10b981"/>
    </g>

    <!-- Typography 'typebangla' -->
    <text x="195" y="112" fill="#ffffff" font-family="Inter, system-ui, sans-serif" font-weight="900" font-size="82" letter-spacing="-2">
      type<tspan fill="#10b981">bangla</tspan>
    </text>
    
    <!-- Domain Pill -->
    <g transform="translate(680, 52)">
      <rect x="0" y="0" width="120" height="52" rx="26" fill="url(#ogEmerald)"/>
      <text x="60" y="34" fill="#ffffff" font-family="Inter, system-ui, sans-serif" font-weight="900" font-size="26" text-anchor="middle">.com</text>
    </g>
  </g>

  <!-- Tagline Text -->
  <text x="600" y="415" fill="#a1a1aa" font-family="system-ui, sans-serif" font-weight="700" font-size="28" text-anchor="middle">
    বাংলাদেশের প্রিমিয়াম অনলাইন টাইপিং লার্নিং ও সরকারি পরীক্ষা স্পিড টেস্ট পোর্টাল
  </text>

  <!-- Feature Badges -->
  <g transform="translate(240, 475)">
    <rect x="0" y="0" width="220" height="44" rx="22" fill="#18181b" stroke="#27272a"/>
    <text x="110" y="28" fill="#38bdf8" font-family="Inter, sans-serif" font-weight="800" font-size="16" text-anchor="middle">⚡ UniBijoy &amp; Avro</text>

    <rect x="250" y="0" width="220" height="44" rx="22" fill="#18181b" stroke="#27272a"/>
    <text x="360" y="28" fill="#10b981" font-family="Inter, sans-serif" font-weight="800" font-size="16" text-anchor="middle">🏆 Govt Job Exams</text>

    <rect x="500" y="0" width="220" height="44" rx="22" fill="#18181b" stroke="#27272a"/>
    <text x="610" y="28" fill="#c084fc" font-family="Inter, sans-serif" font-weight="800" font-size="16" text-anchor="middle">🎓 Verified PDF Certs</text>
  </g>
</svg>
